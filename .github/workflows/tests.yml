name: tests

on:
  push:
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, mbstring
          coverage: none
      - run: composer update --no-interaction --no-progress
      - run: vendor/bin/phpunit
      - name: Run examples
        run: |
          for f in examples/ex*.php example-cli.php; do
            php -d error_reporting=-1 -d display_errors=1 "$f" || exit 1
          done
